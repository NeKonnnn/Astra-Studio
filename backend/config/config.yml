# Конфигурация astrachat Backend
# Теперь каждая модель вынесена в отдельный изолированный микросервис
#
# Сетевые URL задаются только в секции urls: ниже. Поля microservices.*.url не используются
# (удалены); таймауты и прочие параметры — в microservices.
#
# ========================================================
# Цепочка агентов (Mixture-of-Agents) и субагенты — только ENV / ConfigMap.
# В YAML этих ключей нет, они перечислены здесь как документация.
#
#   AGENT_CHAIN_MAX_AGENTS          — 10   платформенный максимум следующих в цепочке
#   AGENT_SUBAGENTS_MAX             — 10   платформенный максимум субагентов в списке
#   AGENT_GRAPH_STEPS               — 50   шаги графа (LLM ↔ инструменты)
#   SUBAGENT_REQUIRED_CONCURRENCY   — 3    параллелизм обязательных субагентов по тегам
#   SUBAGENT_MAX_TOKENS_FLOOR       — 4096 нижний пол max_tokens у дочернего субагента
#
# Per-agent (конструктор, config JSON): max_chain_agents, max_subagents,
# shared_chain_rag, subagents.required_tag_ids / required_only — не выше
# платформенных лимитов выше.
# ========================================================

# Основные настройки приложения
app:
  name: "astrachat Backend"
  version: "1.0.0"
  description: "Backend service with distributed AI microservices"
  debug: false

# Настройки сервера
server:
  host: "0.0.0.0"
  port: 8000
  log_level: "INFO"
  workers: 1

# CORS: пустой список — origins берутся из urls (frontend_*, backend_*)
cors:
  allowed_origins: []
  allow_credentials: true
  allow_methods: ["*"]
  allow_headers: ["*"]

# Аутентификация: блокировка после серии неверных паролей
# AUTH_SESSION_TIMEOUT_SECONDS — в .env (0 = отключено, для локальной разработки)
auth:
  login_lockout:
    enabled: true
    max_failed_attempts: 5
    lockout_duration_seconds: 900

# Coding agent (workspace tools в чате, паттерн Odysseus)
coding_agent:
  enabled: true
  max_rounds: 50
  max_tool_calls: 40
  bash_timeout_sec: 60
  python_timeout_sec: 60
  # Пусто = любой абсолютный путь (dev). В prod задайте корни, напр. /workspaces
  allowed_roots: []
  # Windows-путь с хоста → путь внутри контейнера (см. volumes в docker-compose)
  path_aliases:
    "F:/test_CLI": "/workspaces/test_CLI"
    "F:\\test_CLI": "/workspaces/test_CLI"
  # Workspace по умолчанию и пресеты для UI (шестерёнка → Coding)
  default_workspace: /workspaces/test_CLI
  workspace_presets:
    - id: test_cli
      label: "Test CLI"
      path: /workspaces/test_CLI
      host_hint: "F:/test_CLI"

# ========================================================
# MCP PLATFORM (универсальная интеграция MCP-серверов)
# ========================================================
mcp:
  enabled: true
  # MCP в чате только по tool_ids с UI (none = не подключать автоматически)
  chat_default: none
  tools_cache_ttl_seconds: 60
  pool:
    max_size: 4
    idle_ttl_seconds: 120
    acquire_timeout_seconds: 5
  servers:
    - id: atlassian
      display_name: "Jira / Confluence"
      enabled: false
      transport: streamable-http
      base_url: ""
      base_path: /mcp
      health_path: /healthz
      stateless: true
      timeout_seconds: 120
      credential_provider: atlassian
      tool_name_prefix: mcp_atlassian_
      auth_mode: service_account
      auth_type: none
    # Open-WebSearch — веб-поиск без API-ключей (https://github.com/Aas-ee/open-webSearch)
    # Локально: stdio через npx. В Docker: MCP_SERVER_WEBSEARCH_TRANSPORT=streamable-http
    - id: websearch
      display_name: "Поиск в интернете"
      enabled: true
      transport: stdio
      command: npx
      args:
        - "-y"
        - "open-websearch@latest"
      env:
        MODE: stdio
        DEFAULT_SEARCH_ENGINE: duckduckgo
        ALLOWED_SEARCH_ENGINES: duckduckgo,bing,exa,brave
      timeout_seconds: 180
      tool_name_prefix: mcp_websearch_
      auth_mode: service_account
      auth_type: none
  forward_headers:
    enabled: true
    user:
      username: "X-GPB-Ldap-User"
      user_id: "X-GPB-User-Id"
      email: "X-GPB-User-Email"
    chat_id_header: "X-OpenWebUI-Chat-Id"
    message_id_header: "X-OpenWebUI-Message-Id"

# ========================================================
# НАСТРОЙКИ МИКРОСЕРВИСОВ (ML Services)
# ========================================================
microservices:
  llm:
    enabled: true
    timeout: 300
    default_host_id: "local"
    hosts:
      - id: local
        # base_url подставляется из urls.llm_service_docker / llm_service_port при загрузке, если пусто
        base_url: ""
    models:
      default: "Qwen3.5-4B-UD-Q8_K_XL"
      fallback: "Qwen3-Coder-30B-A3B-Instruct-Q8_0"

  stt:
    enabled: true
    timeout: 900
    whisperx:
      enabled: true
      compute_type: "int8"

  tts:
    enabled: true
    timeout: 300

  diarization:
    enabled: true
    timeout: 3600

  ocr:
    enabled: true
    timeout: 300

# ========================================================
# ПАМЯТЬ И БАЗЫ ДАННЫХ
# ========================================================
memory:
  enabled: true
  storage_type: "file"
  file_path: "/app/memory"
  max_history_length: 100

mongodb:
  host: "mongodb"
  port: 27017
  database: "astrachat"
  user: "admin"
  password: "password"

postgresql:
  host: "postgresql"
  port: 5432
  database: "astrachat"
  user: "admin"
  password: "password"
  embedding_dim: 384

minio:
  endpoint: "minio"
  port: 9000
  access_key: "minioadmin"
  secret_key: "minioadmin"
  use_ssl: false
  bucket_name: "memoai-temp"
  documents_bucket_name: "astrachat-documents"
  memory_rag_bucket_name: "astrachat-memory-rag"
  project_rag_bucket_name: "astrachat-project-rag"

# ========================================================
# ГЕНЕРАЦИЯ ИЗОБРАЖЕНИЙ (ComfyUI, как Open WebUI)
# В Docker: сервис comfyui в docker-compose, URL бэкенда: http://comfyui:8188 (см. IMAGE_GEN_COMFYUI_URL).
# Локально: python main.py --listen 0.0.0.0 --port 8188
# Ноды: ComfyUI-GGUF (Unet Loader), workflow экспорт «Save (API Format)».
# node_map — id нод из JSON (строками): куда подставить prompt / width / height / steps / seed.
# Пример: prompt.node / prompt.input, width.node для KSampler или EmptyLatentImage и т.д. — см. свой API JSON.
# При необходимости задайте IMAGE_GEN_* в .env (см. ImageGenerationConfig в backend/settings/config.py).
# ========================================================
image_generation:
  enabled: true
  comfyui_base_url: "http://127.0.0.1:8188"
  # URL для браузера (в Docker: localhost:8188, бэкенд ходит на comfyui:8188)
  comfyui_public_url: "http://localhost:8188"
  # Workflow (от backend/):
  #   flux_schnell_fp8_txt2img_api.json — Flux.1 Schnell FP8, 4 шага, ~17 ГБ, Apache (рекомендуется)
  #   flux_dev_fp8_txt2img_api.json     — Flux.1 Dev FP8, 20 шагов, выше качество, лицензия dev
  #   sd15_txt2img_api.json             — SD 1.5, лёгкий fallback
  workflow_path: "config/comfy_workflows/flux_schnell_fp8_txt2img_api.json"
  request_timeout_sec: 900
  poll_interval_sec: 1.0
  chat_triggers_enabled: false
  default_width: 1024
  default_height: 1024
  default_steps: 4
  # Имя .safetensors в models/comfyui/checkpoints/ (пусто = из workflow)
  checkpoint_name: "flux1-schnell-fp8.safetensors"
  default_preset_id: "flux_schnell_fp8"
  presets:
    flux_schnell_fp8:
      label: "Flux Schnell FP8"
      description: "Современное качество, 4 шага, 1024×1024"
      workflow_path: "config/comfy_workflows/flux_schnell_fp8_txt2img_api.json"
      checkpoint_name: "flux1-schnell-fp8.safetensors"
      default_width: 1024
      default_height: 1024
      default_steps: 4
      node_map:
        prompt: { node: "6", input: "text" }
        negative_prompt: { node: "7", input: "text" }
        width: { node: "5", input: "width" }
        height: { node: "5", input: "height" }
        steps: { node: "3", input: "steps" }
        seed: { node: "3", input: "seed" }
        cfg: { node: "3", input: "cfg" }
        denoise: { node: "3", input: "denoise" }
        checkpoint: { node: "4", input: "ckpt_name" }
    flux_dev_fp8:
      label: "Flux Dev FP8"
      description: "Максимальное качество, 20 шагов (нужен flux1-dev-fp8.safetensors)"
      workflow_path: "config/comfy_workflows/flux_dev_fp8_txt2img_api.json"
      checkpoint_name: "flux1-dev-fp8.safetensors"
      default_width: 1024
      default_height: 1024
      default_steps: 20
      node_map:
        prompt: { node: "6", input: "text" }
        negative_prompt: { node: "7", input: "text" }
        width: { node: "5", input: "width" }
        height: { node: "5", input: "height" }
        steps: { node: "3", input: "steps" }
        seed: { node: "3", input: "seed" }
        cfg: { node: "3", input: "cfg" }
        denoise: { node: "3", input: "denoise" }
        checkpoint: { node: "4", input: "ckpt_name" }
    sd15:
      label: "Stable Diffusion 1.5"
      description: "Быстро и легко, 512×512"
      workflow_path: "config/comfy_workflows/sd15_txt2img_api.json"
      checkpoint_name: "v1-5-pruned-emaonly.safetensors"
      default_width: 512
      default_height: 512
      default_steps: 20
      node_map:
        prompt: { node: "6", input: "text" }
        negative_prompt: { node: "7", input: "text" }
        width: { node: "5", input: "width" }
        height: { node: "5", input: "height" }
        steps: { node: "3", input: "steps" }
        seed: { node: "3", input: "seed" }
        cfg: { node: "3", input: "cfg" }
        denoise: { node: "3", input: "denoise" }
        checkpoint: { node: "4", input: "ckpt_name" }
  node_map:
    prompt:
      node: "6"
      input: "text"
    width:
      node: "5"
      input: "width"
    height:
      node: "5"
      input: "height"
    steps:
      node: "3"
      input: "steps"
    seed:
      node: "3"
      input: "seed"

# ========================================================
# ГЕНЕРАЦИЯ ВИДЕО (ComfyUI)
# Укажите workflow API JSON с нодой сохранения видео (VHS / SaveVideo и т.п.)
# и node_map с ключами prompt, width, height, steps, seed, frames (по необходимости).
# ========================================================
video_generation:
  enabled: true
  comfyui_base_url: "http://127.0.0.1:8188"
  comfyui_public_url: "http://localhost:8188"
  workflow_path: ""
  request_timeout_sec: 1800
  poll_interval_sec: 1.0
  chat_triggers_enabled: false
  default_width: 512
  default_height: 512
  default_steps: 20
  default_frames: 16
  checkpoint_name: ""
  default_preset_id: ""
  presets: {}
  node_map: {}

# ========================================================
# ПУТИ И СИСТЕМНЫЕ НАСТРОЙКИ
# ========================================================
paths:
  whisperx_models_dir: "whisperx_models"
  diarize_models_dir: "diarize_models"
  model_path: "models"
  memory_path: "memory"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "/app/logs/backend.log"
  max_size: 10485760
  backup_count: 5


urls:
  # Legacy aliases (для совместимости со старым кодом/интеграциями)
  frontend_port: "http://localhost:3000"
  frontend_port_ipv4: "http://127.0.0.1:3000"
  backend_port: "http://localhost:8000"
  backend_port_ipv4: "http://127.0.0.1:8000"
  ingress_port: "http://localhost:8000"

  frontend_port_1: "http://localhost:3000"
  frontend_port_1_ipv4: "http://127.0.0.1:3000"
  frontend_port_2: "http://localhost:3001"
  frontend_port_2_ipv4: "http://127.0.0.1:3001"
  frontend_port_3: "http://localhost:5173"
  frontend_port_3_ipv4: "http://127.0.0.1:5173"

  backend_port_1: "http://localhost:8000"
  backend_port_1_ipv4: "http://127.0.0.1:8000"
  backend_port_2: "http://localhost:8080"
  backend_port_2_ipv4: "http://127.0.0.1:8080"

  frontend_docker: "http://astrachat-frontend:3000"
  backend_docker: "http://astrachat-backend:8000"

  llm_service_port: "http://localhost:8002"
  llm_service_docker: "http://llm-service:8000"

  stt_service_port: "http://localhost:8001"
  stt_service_docker: "http://stt-service:8000"

  tts_service_port: "http://localhost:8005"
  tts_service_docker: "http://tts-service:8000"

  ocr_service_port: "http://localhost:8004"
  ocr_service_docker: "http://ocr-service:8000"

  diarization_service_port: "http://localhost:8003"
  diarization_service_docker: "http://diarization-service:8000"

  rag_service_port: "http://localhost:8011"
  rag_service_docker: "http://svc-rag:8000"

  rag_models_service_port: "http://localhost:8010"
  rag_models_service_docker: "http://rag-models:8000"

  # MCP Atlassian (8012 — 8011 занят svc-rag)
  mcp_atlassian_service_port: "http://localhost:8012"
  mcp_atlassian_service_docker: "http://mcp-atlassian:8000"

  # MCP Open-WebSearch (8013 — веб-поиск для LLM)
  mcp_websearch_service_port: "http://localhost:8013"
  mcp_websearch_service_docker: "http://mcp-websearch:3000"

# ========================================================
# ПЛАГИНЫ (HTTP-микросервисы в галерее / конструкторе агентов)
# ========================================================
plugins:
  enabled: true
  # ENV: PLUGINS_ENABLED
  # Каталог пуст: cash-flow и др. добавим, когда сервис будет доступен.
  catalog: {}
