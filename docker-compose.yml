services:
  # LLM Service (только LLM модели)
  llm-service:
    build:
      context: ./llm-svc
      dockerfile: Dockerfile.cuda
    ports:
      - "8002:8000"
    gpus: all
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      # 27B Q8 (~30 ГБ) на CPU: дефолт 600с не хватает; backend httpx = 2400с.
      - LLM_MODEL_LOAD_TIMEOUT=${LLM_MODEL_LOAD_TIMEOUT:-1800}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # Только основной набор весов (на хосте: ./models/llm/… → в контейнере /app/models/llm/…)
      - ./models/llm:/app/models/llm:ro
      - ./llm-svc/config:/app/config:ro
    restart: unless-stopped
    networks:
      - astrachat-network

  # ComfyUI — генерация изображений (GGUF Unet через ComfyUI-GGUF). Модели: ./models/comfyui → /app/ComfyUI/models
  # UI/API: http://localhost:8188 ; из astrachat-backend: http://comfyui:8188 (переменная IMAGE_GEN_COMFYUI_URL)
  comfyui:
    build:
      context: ./docker/comfyui
      dockerfile: Dockerfile
    container_name: astrachat-comfyui
    ports:
      - "8188:8188"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      # RTX 50xx: образ на PyTorch 2.7 + CUDA 12.8. Временный обход без GPU: COMFYUI_FORCE_CPU=1
      - COMFYUI_FORCE_CPU=${COMFYUI_FORCE_CPU:-0}
      # Разрешить UI/iframe из AstraChat (иначе ComfyUI → HTTP 403 при несовпадении Origin/Host)
      - COMFYUI_ENABLE_CORS_HEADER=${COMFYUI_ENABLE_CORS_HEADER:-1}
      - COMFYUI_CORS_HEADER=${COMFYUI_CORS_HEADER:-*}
    volumes:
      - ./models/comfyui:/app/ComfyUI/models
      - comfyui_output:/app/ComfyUI/output
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8188/queue"]
      interval: 20s
      timeout: 10s
      retries: 25
      start_period: 360s
    restart: unless-stopped
    networks:
      - astrachat-network

  # STT Service (WhisperX)
  stt-service:
    build:
      context: ./SVC-SPEECH-RECG
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./whisperx_models:/app/models/whisperx_models
      - ./SVC-SPEECH-RECG/config:/app/config:ro
    restart: unless-stopped
    networks:
      - astrachat-network

  # TTS Service (Silero)
  tts-service:
    build:
      context: ./SVC-SPEECH-SYNT
      dockerfile: Dockerfile
    ports:
      - "8005:8000"
    volumes:
      - ./silero_models:/app/models/silero:ro
      - ./SVC-SPEECH-SYNT/config:/app/config:ro
    restart: unless-stopped
    networks:
      - astrachat-network

  # OCR Service (Surya). Backend вызывает его по http://ocr-service:8000 (SVC_OCR_URL) для извлечения текста из изображений при загрузке документов.
  ocr-service:
    build:
      context: ./SVC-OCR
      dockerfile: Dockerfile
    ports:
      - "8004:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./SVC-OCR/config:/app/config:ro
      - ./surya_models:/app/models/surya
    environment:
      - DATALAB_CACHE_DIR=/app/models/surya
      - HF_HOME=/app/models/surya
      - HF_HUB_CACHE=/app/models/surya
      - TRANSFORMERS_CACHE=/app/models/surya
    restart: unless-stopped
    networks:
      - astrachat-network

  # Diarization Service
  diarization-service:
    build:
      context: ./SVC-SPEECH-DIAR
      dockerfile: Dockerfile
    ports:
      - "8003:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./diarize_models:/app/models/diarization:ro
      - ./SVC-SPEECH-DIAR/config:/app/config:ro
    environment:
      - CONFIG_PATH=/app/config/config.yml
    restart: unless-stopped
    networks:
      - astrachat-network

  # Backend - FastAPI (теперь зависит от llm-svc, MongoDB и PostgreSQL)
  astrachat-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./memory:/app/memory
      - F:/test_CLI:/workspaces/test_CLI
      - ./uploads:/app/uploads  # Директория для загруженных документов
      - ./backend:/app  # Полное монтирование для работы импортов
      - ./models:/app/models:ro  # Монтирование локальных моделей (эмбеддинги и др.)
    environment:
      - PYTHONPATH=/app
      # Старые переменные (для обратной совместимости)
      - LLM_SERVICE_URL=${LLM_SVC_INTERNAL_URL:-http://llm-service:8000}
      - USE_LLM_SVC=${USE_LLM_SVC:-true}
      - LLM_SVC_TIMEOUT=${LLM_SVC_TIMEOUT:-300}
      - LLM_SVC_RETRY_ATTEMPTS=${LLM_SVC_RETRY_ATTEMPTS:-3}
      - LLM_SVC_RETRY_DELAY=${LLM_SVC_RETRY_DELAY:-1}
      # JWT / auth (backend/auth/jwt_handler.py)
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-change-in-production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production}
      - JWT_ACCESS_TOKEN_EXPIRE_SECONDS=${JWT_ACCESS_TOKEN_EXPIRE_SECONDS:-1800}
      - JWT_REFRESH_TOKEN_EXPIRE_SECONDS=${JWT_REFRESH_TOKEN_EXPIRE_SECONDS:-604800}
      - AUTH_MAX_ACTIVE_SESSION=${AUTH_MAX_ACTIVE_SESSION:-5}
      - AUTH_SESSION_TIMEOUT_SECONDS=${AUTH_SESSION_TIMEOUT_SECONDS:-0}
      - LDAP_ENABLED=${LDAP_ENABLED:-false}
      # Новые адреса микросервисов (используются backend/config/config.py и backend/llm_client.py)
      - SVC_LLM_URL=http://llm-service:8000
      - SVC_STT_URL=http://stt-service:8000
      - SVC_TTS_URL=http://tts-service:8000
      - SVC_OCR_URL=http://ocr-service:8000
      - SVC_DIARIZATION_URL=http://diarization-service:8000
      - DOCKER_ENV=${DOCKER_ENV:-true}
      - CONFIG_PATH=${CONFIG_PATH}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEBUG=${DEBUG:-false}
      # MongoDB настройки
      - MONGODB_HOST=${MONGODB_HOST:-mongodb}
      - MONGODB_PORT=${MONGODB_PORT:-27017}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-astrachat}
      # Root из mongo:7 (MONGO_INITDB_ROOT_*) живёт в admin — иначе ping/подключение без authSource падает
      - MONGODB_AUTH_SOURCE=${MONGODB_AUTH_SOURCE:-admin}
      - MONGODB_USER=${MONGODB_USER:-admin}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD:-password}
      # PostgreSQL настройки
      - POSTGRES_HOST=${POSTGRES_HOST:-postgresql}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-astrachat}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      # MinIO настройки
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-astrachat-temp}
      - MINIO_DOCUMENTS_BUCKET_NAME=${MINIO_DOCUMENTS_BUCKET_NAME:-astrachat-documents}
      - MINIO_MEMORY_RAG_BUCKET_NAME=${MINIO_MEMORY_RAG_BUCKET_NAME:-astrachat-memory-rag}
      # RAG (SVC-RAG) URL для backend/rag_client.py
      - SVC_RAG_URL=http://svc-rag:8000/v1
      # Общий секрет backend↔svc-rag (X-API-Key). Без него svc-rag fail-closed → 503.
      - SVC_RAG_API_KEY=${SVC_RAG_API_KEY:-dev-svc-rag-key}
      - RAG_MODELS_SERVICE_URL=${RAG_MODELS_SERVICE_URL:-http://rag-models:8000}
      # FEATURE-FLAG: без true require_service("rag") → «в разработке» (нужен и postgresql)
      - RAG_SERVICE_ENABLED=${RAG_SERVICE_ENABLED:-true}
      - RAG_MODELS_SERVICE_ENABLED=${RAG_MODELS_SERVICE_ENABLED:-true}
      - POSTGRESQL_SERVICE_ENABLED=${POSTGRESQL_SERVICE_ENABLED:-true}
      # Поиск в чате: не держать UI «думает…» 4+ мин на cold MiniCPM/CPU
      - SVC_RAG_SEARCH_READ_TIMEOUT=${SVC_RAG_SEARCH_READ_TIMEOUT:-90}
      - MINIO_SERVICE_ENABLED=${MINIO_SERVICE_ENABLED:-true}
      - AGENTS_SERVICE_ENABLED=${AGENTS_SERVICE_ENABLED:-true}
      - STT_SERVICE_ENABLED=${STT_SERVICE_ENABLED:-true}
      - TTS_SERVICE_ENABLED=${TTS_SERVICE_ENABLED:-true}
      - DIARIZATION_SERVICE_ENABLED=${DIARIZATION_SERVICE_ENABLED:-true}
      # Служебные LLM-вызовы RAG (HyDE/multi-query/judge): гасить мышление, min max_tokens
      - LLM_SERVICE_DISABLE_THINKING=${LLM_SERVICE_DISABLE_THINKING:-true}
      - LLM_SERVICE_MIN_MAX_TOKENS=${LLM_SERVICE_MIN_MAX_TOKENS:-1024}
      - RAG_MEMORY_ENABLED=${RAG_MEMORY_ENABLED:-true}
      - RAG_TYPOS_MIN_SIMILARITY=${RAG_TYPOS_MIN_SIMILARITY:-0.6}
      # ComfyUI в compose: бэкенд ходит на сервис comfyui (перекрывает comfyui_base_url из YAML при генерации картинок)
      - IMAGE_GEN_COMFYUI_URL=http://comfyui:8188
      # MCP Open-WebSearch: в Docker — HTTP к контейнеру mcp-websearch (stdio/npx только для локальной разработки)
      - MCP_SERVER_WEBSEARCH_TRANSPORT=${MCP_SERVER_WEBSEARCH_TRANSPORT:-streamable-http}
      - MCP_SERVER_WEBSEARCH_BASE_PATH=/mcp
      - MCP_SERVER_WEBSEARCH_HEALTH_PATH=/mcp
    depends_on:
      comfyui:
        condition: service_started
      llm-service:
        condition: service_started
      stt-service:
        condition: service_started
      tts-service:
        condition: service_started
      ocr-service:
        condition: service_started
      diarization-service:
        condition: service_started
      mongodb:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      minio:
        condition: service_healthy
      mcp-websearch:
        condition: service_started
    restart: unless-stopped
    networks:
      - astrachat-network

  # MCP Open-WebSearch — веб-поиск для LLM (https://github.com/Aas-ee/open-webSearch)
  mcp-websearch:
    image: ghcr.io/aas-ee/open-web-search:latest
    container_name: astrachat-mcp-websearch
    ports:
      - "8013:3000"
    environment:
      NODE_ENV: production
      DEFAULT_SEARCH_ENGINE: duckduckgo
      ALLOWED_SEARCH_ENGINES: duckduckgo,bing,exa,brave
      ENABLE_CORS: "true"
      CORS_ORIGIN: "*"
    command: ["node", "build/index.js"]
    restart: unless-stopped
    networks:
      - astrachat-network

  # RAG Models Service (эмбеддинги + реранкер для SVC-RAG)
  rag-models:
    build:
      context: ./SVC-RAG-MODELS
      dockerfile: Dockerfile
    container_name: astrachat-rag-models
    ports:
      - "8010:8000"
    volumes:
      - ./models:/app/models:ro        # models/rag/* внутри контейнера
      - ./SVC-RAG-MODELS/config:/app/config:ro
    environment:
      - CONFIG_PATH=/app/config/config.yml
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/v1/health"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 600s
    restart: unless-stopped
    networks:
      - astrachat-network

  # RAG Logic Service (SVC-RAG) — парсинг, pgvector, BM25, иерархия
  svc-rag:
    build:
      context: ./SVC-RAG
      dockerfile: Dockerfile
    container_name: astrachat-svc-rag
    ports:
      - "8011:8000"
    volumes:
      - ./SVC-RAG/config:/app/config:ro
    environment:
      - CONFIG_PATH=/app/config/config.yml
      - DOCKER_ENV=true
      # Тот же секрет, что у astrachat-backend (иначе reindex/status и RAG → 503).
      - SVC_RAG_API_KEY=${SVC_RAG_API_KEY:-dev-svc-rag-key}
      # URL сервиса моделей (RAG-MODELS)
      - RAG_MODELS_URL=http://rag-models:8000
      # Лимит пассажей в LLM-реранкер (MiniCPM на CPU иначе минуты на запрос)
      - RAG_RERANK_INPUT_CAP=${RAG_RERANK_INPUT_CAP:-16}
      - RAG_RERANK_TOP_K=${RAG_RERANK_TOP_K:-12}
      # Параллельные embed-батчи (POST /embeddings)
      - RAG_MODELS_CLIENT_EMBED_CONCURRENCY=${RAG_MODELS_CLIENT_EMBED_CONCURRENCY:-4}
      - RAG_EMBED_GUARDRAIL_ISOLATE=${RAG_EMBED_GUARDRAIL_ISOLATE:-1}
      # ANN: hnsw | ivfflat (свап без переиндексации данных)
      - RAG_VECTOR_INDEX_METHOD=${RAG_VECTOR_INDEX_METHOD:-hnsw}
      - RAG_VECTOR_IVFFLAT_LISTS=${RAG_VECTOR_IVFFLAT_LISTS:-100}
      - RAG_VECTOR_IVFFLAT_PROBES=${RAG_VECTOR_IVFFLAT_PROBES:-10}
      - RAG_VECTOR_HNSW_M=${RAG_VECTOR_HNSW_M:-16}
      - RAG_VECTOR_HNSW_EF_CONSTRUCTION=${RAG_VECTOR_HNSW_EF_CONSTRUCTION:-64}
      - RAG_VECTOR_HNSW_EF_SEARCH=${RAG_VECTOR_HNSW_EF_SEARCH:-40}
      # PostgreSQL (общая БД с backend)
      - POSTGRES_HOST=${POSTGRES_HOST:-postgresql}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-astrachat}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - RAG_EMBEDDING_DIM=1536
      # OCR и LLM сервисы (для OCR PDF/картинок и L2-суммаризации)
      - SVC_OCR_URL=http://ocr-service:8000
      - SVC_LLM_URL=http://llm-service:8000
    depends_on:
      rag-models:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      ocr-service:
        condition: service_started
      llm-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - astrachat-network

  # Frontend - React
  astrachat-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:8000
        - REACT_APP_WS_URL=ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      astrachat-backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - astrachat-network

  # MongoDB - для хранения диалогов
  mongodb:
    image: mongo:7
    container_name: astrachat-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-password}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-astrachat}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks:
      - astrachat-network

  # PostgreSQL + pgvector - для RAG системы
  postgresql:
    image: pgvector/pgvector:pg17
    container_name: astrachat-postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-astrachat}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready может быть green ещё в recovery — дополнительно проверяем SELECT 1
      # и что инстанс не в recovery (без 1/0: иначе healthcheck засоряет лог ERROR).
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-admin} -d $${POSTGRES_DB:-astrachat} && psql -U $${POSTGRES_USER:-admin} -d $${POSTGRES_DB:-astrachat} -tAc \"SELECT NOT pg_is_in_recovery()\" | grep -qx t",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    networks:
      - astrachat-network

  # MinIO - для хранения временных файлов (голосовые файлы, транскрибация)
  minio:
    image: minio/minio:latest
    container_name: astrachat-minio
    ports:
      - "9000:9000"  # API порт
      - "9001:9001"  # Console порт
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - astrachat-network

  # Redis удален - не используется в проекте

  # Nginx для продакшена (опционально)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - astrachat-backend
      - astrachat-frontend
    restart: unless-stopped
    networks:
      - astrachat-network
    profiles:
      - production

# volumes:
#   # Кэш для моделей (загружаемых из облака)
#   llm_models_cache:
#     driver: local

volumes:
  # Кэш для моделей (загружаемых из облака)
  llm_models_cache:
    driver: local
  # MongoDB данные
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  # PostgreSQL данные
  postgresql_data:
    driver: local
  # MinIO данные
  minio_data:
    driver: local
  comfyui_output:
    driver: local

networks:
  astrachat-network:
    driver: bridge