# SVC-RAG: логика RAG (парсинг, чанкинг, поиск). Локальные веса — в SVC-RAG-MODELS.

server:
  host: "0.0.0.0"
  port: 8000
  log_level: "INFO"
  docs_url: "/docs"
  redoc_url: "/redoc"

cors:
  allowed_origins: []
  allow_credentials: true
  allow_methods: ["*"]
  allow_headers: ["*"]

urls:
  frontend_port_1: "http://localhost:3000"
  frontend_port_1_ipv4: "http://127.0.0.1:3000"
  frontend_port_2: "http://localhost:3001"
  frontend_port_2_ipv4: "http://127.0.0.1:3001"
  frontend_port_3: "http://localhost:5173"
  frontend_port_3_ipv4: "http://127.0.0.1:5173"
  backend_port_1: "http://localhost:8000"
  backend_port_1_ipv4: "http://127.0.0.1:8000"
  backend_port_2: "http://localhost:8080"
  backend_port_2_ipv4: "http://127.0.0.1:8080"
  llm_service_port: "http://localhost:8002"
  llm_service_docker: "http://llm-service:8000"
  ocr_service_port: "http://localhost:8004"
  ocr_service_docker: "http://ocr-service:8000"
  rag_models_service_port: "http://localhost:8010"
  rag_models_service_docker: "http://rag-models:8000"
  backend_service_port: "http://localhost:8000"

# Провайдер эмбеддингов/реранкера: native (SVC-RAG-MODELS) или openai-compat (Phoenix и т.п.)
rag_models:
  provider: "native"
  providers:
    - id: "Phoenix"
      kind: "openai-compat"
      base_url: ""
      api_key_env: "LLM_API_KEY_PHOENIX"
      timeout: 300
      embed_path: "/v1/embeddings"
      rerank_path: "/v1/rerank"
      embedding_model: ""
      reranker_model: ""
      chat_only: false
      embed_payload_style: "openai"
      rerank_payload_style: "openai"

app:
  title: "astrachat RAG Service"
  description: "Индексация документов и поиск (pgvector + BM25), эмбеддинги и реранкер через SVC-RAG-MODELS"
  version: "1.0.0"

logging:
  level: "INFO"
  noisy_level: "WARNING"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# ========================================================
# CEF-АУДИТ
# ========================================================
# Пишется отдельным каналом (логгер "cef", свой обработчик, propagate=False),
# поэтому logging.level выше на него НЕ влияет.
audit:
  # Фоновый поллинг интерфейса — успешные GET по /reindex/status и спискам
  # документов. Один опрос плашки переиндексации = пять запросов сюда, то есть
  # пять событий OBJ001 каждые несколько секунд с каждой открытой вкладки.
  #
  # Аудировать ли их вообще. true — да, но с прореживанием (см. интервал ниже).
  # false — не аудировать такие чтения совсем.
  #
  # Изменения (POST/DELETE), ошибки и отказы доступа аудируются ВСЕГДА,
  # независимо от обеих настроек.
  #
  # ENV перекрывает: CEF_AUDIT_POLLING
  cef_polling: true

  # Окно прореживания, секунд. Одно событие на (пользователь, метод, путь) в
  # окно; в событие проставляется cn1 = сколько обращений оно представляет.
  # При опросе раз в 5 с и окне 60 с это 3 события вместо 25 за две минуты,
  # и по cn1 видно реальный объём.
  #
  # 0 — без прореживания, событие на каждое обращение (как было до правки).
  #
  # ⚠ Если AUDIT_CEF_ENABLED не выставлен, syslog отключён и stdout —
  # единственный транспорт аудита. Прореживание уменьшает и его. Согласуйте
  # с ИБ: 60 с — компромисс, факт обращений сохраняется, объём падает в разы.
  #
  # ENV перекрывает: CEF_AUDIT_POLLING_INTERVAL
  cef_polling_interval_seconds: 120

# ========================================================
# ИНТЕГРАЦИИ И БАЗЫ ДАННЫХ
# ========================================================
# provider=native (local/FRIDA): base_url из urls.rag_models_service_port → SVC-RAG-MODELS.
# phoenix/… → rag_models.providers.Phoenix (LiteLLM). OCR — ocr-service из urls.
rag_models_client:
  base_url: ""
  timeout: 600.0
  embed_batch_size: 24
  # Параллельные POST /embeddings при индексации (K8s: RAG_MODELS_CLIENT_EMBED_CONCURRENCY)
  embed_concurrency: 4
  api_key_env: ""
  embedding_model: ""
  reranker_model: ""

llm_service:
  base_url: ""
  timeout: 120.0
  default_model: "default"

ocr:
  url: ""
  timeout: 300.0

postgresql:
  host: "postgresql"
  port: 5432
  database: "astrachat"
  user: "admin"
  password: "password"
  embedding_dim: 384

minio:
  endpoint: "minio"
  port: 9000
  access_key: "minioadmin"
  secret_key: "minioadmin"
  use_ssl: false
  bucket_name: "astrachat-temp"
  documents_bucket_name: "astrachat-documents"

rag:
  enabled: true

  use_hybrid_search: true
  hybrid_bm25_weight: 0.35
  hybrid_diversify_results: true
  # 0 = без лимита на документ (нет вытеснения чанков одного большого файла).
  hybrid_max_chunks_per_document: 0
  vector_max_chunks_per_document: 0

  # Хранить готовые BM25-индексы в Postgres и отпускать их из памяти.
  # ENV перекрывает: RAG_BM25_STORE_ENABLED
  bm25_store_enabled: true
  memprobe: "on" # ENV RAG_MEMPROBE

  # Сколько секунд держать индекс после последнего поиска по нему.
  # ENV перекрывает: RAG_BM25_RETAIN_SECONDS
  bm25_retain_seconds: 2

  # Возвращать ли ядру память отпущенного индекса сразу (glibc malloc_trim).
  # ENV перекрывает: RAG_BM25_MALLOC_TRIM
  bm25_malloc_trim: true

  use_reranking: true
  rerank_top_k: 40
  rerank_min_score: 0

  min_vector_similarity: 0.05
  min_chunk_length: 40

  chunk_size: 1000
  chunk_overlap: 250

  sentence_window: 0

  use_hierarchical_indexing: true
  hierarchical_threshold: 8000
  hierarchical_chunk_size: 1500
  hierarchical_chunk_overlap: 200
  intermediate_summary_chunks: 8
  create_full_summary_via_llm: true

  enable_graph_rag: true
  eval_llm_judge_allowed: true

  # ANN pgvector: hnsw (дефолт) | ivfflat. K8s: RAG_VECTOR_INDEX_METHOD
  vector_index_method: hnsw
  vector_ivfflat_lists: 100
  vector_ivfflat_probes: 10
  vector_hnsw_m: 16
  vector_hnsw_ef_construction: 64
  vector_hnsw_ef_search: 40
