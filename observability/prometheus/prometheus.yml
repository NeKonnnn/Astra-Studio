global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: astrachat-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["astrachat-backend:8000"]
        labels:
          service: backend

  - job_name: llm-service
    metrics_path: /metrics
    static_configs:
      - targets: ["llm-service:8000"]
        labels:
          service: llm

  - job_name: svc-rag
    metrics_path: /metrics
    static_configs:
      - targets: ["svc-rag:8000"]
        labels:
          service: rag

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
