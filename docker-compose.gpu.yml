# Оверрайд для запуска llm-service с GPU (NVIDIA, RTX 50xx / Blackwell sm_120).
# Использование:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml build llm-service
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d llm-service
# В llm-svc/config/config.yml: gpu_layers: -1
# Требуется: NVIDIA GPU, драйвер 560+, NVIDIA Container Toolkit.

services:
  llm-service:
    build:
      context: ./llm-svc
      dockerfile: Dockerfile.cuda
    deploy:
      resources:
        limits:
          memory: 50G
        reservations:
          memory: 32G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
