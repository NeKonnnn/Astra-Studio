# Продуктовый мониторинг: Prometheus + Alertmanager + Grafana.
# Запуск вместе со стеком:
#   docker compose -f docker-compose.yml -f docker-compose-backend.yml -f docker-compose.observability.yml up -d
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: astrachat-prometheus
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    restart: unless-stopped
    networks:
      - astrachat-network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: astrachat-alertmanager
    profiles: ["observability"]
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    restart: unless-stopped
    networks:
      - astrachat-network

  grafana:
    image: grafana/grafana:11.3.0
    container_name: astrachat-grafana
    profiles: ["observability"]
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - astrachat-network

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
